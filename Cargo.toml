[package]
name = "asterism-core"
version = "0.1.0"
edition = "2024"
description = "Core abstractions for the Emerald multi-signature custody platform: Signer trait, Federation, descriptor builder, PSBT pipeline, and recovery."
license = "MIT OR Apache-2.0"

[features]
default = []
# Expose `MockSigner` and other test scaffolding to downstream crates.
test-utils = []

[dependencies]
bdk_wallet = "3.1.0"
bitcoin = "0.32.100"
hex = "0.4.3"
miniscript = "12.3.7"
serde = "1.0.228"
serde_json = "1.0.150"
serde_with = "3.21.0"
sha2 = "0.11.0"
thiserror = "2.0.18"

[dev-dependencies]
proptest = "1.11.0"
rand = "0.10.1"
