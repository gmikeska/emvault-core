[package]
name = "emvault-core"
version = "0.3.0"
edition = "2024"
description = "Core abstractions for the EmVault multi-signature custody platform: Signer trait, Federation, descriptor builder, PSBT pipeline, and recovery."
license = "MIT OR Apache-2.0"
repository = "https://github.com/gmikeska/emvault-core"

[features]
default = []
# Expose `MockSigner` and other test scaffolding to downstream crates.
test-utils = []
# Enable RPC tests against an external bitcoind via .env (BITCOIN_RPC_*).
node-tests = []
# Enable Elements/Liquid-aware types in `NetworkType`. The actual Elements
# pipeline lives in the `emvault-elements` companion crate; this feature only
# adds the discriminant variants `emvault-elements` needs to refer to.
elements = []
# Integration tests that exercise sweep algorithms with real HSM-backed
# signers (emvault-pkcs11 + emvault-dev-signer + SoftHSM2).
hsm-sweep-tests = []
# Nodeless Esplora + Waterfalls chain backend. Pulls in the `emvault-esplora`
# companion crate (which owns the `esplora-rs` dep) and re-exports it as
# `emvault_core::esplora`, plus a `From<EsploraSyncResult> for SyncResult`.
esplora = ["dep:emvault-esplora"]
# Descriptor-private Electrum chain backend. Pulls in the `emvault-electrum`
# companion crate (electrs/Electrum over `bdk_electrum`) and re-exports it as
# `emvault_core::electrum`, plus a `From<ElectrumSyncResult> for SyncResult`.
electrum = ["dep:emvault-electrum"]

[dependencies]
# Optional: nodeless Esplora/Waterfalls backend, behind the `esplora` feature.
# Path/patch until published (see emvault-esplora/docs/design/integration-design.md).
emvault-esplora = { version = "0.3.0", path = "../../emvault-esplora", optional = true }
# Optional: descriptor-private Electrum backend, behind the `electrum` feature.
# Path until published (mirrors the emvault-esplora arrangement).
emvault-electrum = { version = "0.1.0", path = "../../emvault-electrum", optional = true }
bdk_wallet = "3.1.0"
# Bitcoin Core RPC chain-sync: the `Emitter` drive loop in `chain_sync` (E3b),
# shared by both consuming apps. `bitcoincore-rpc` supplies the `RpcApi` bound.
bdk_bitcoind_rpc = "0.22"
bitcoincore-rpc = "0.19"
bitcoin = "0.32.10"
hex = "0.4.3"
miniscript = "12.3.7"
serde = "1.0.228"
serde_json = "1.0.150"
serde_with = "3.21.0"
sha2 = "0.11.0"
thiserror = "2.0.18"
uuid = { version = "1.23", features = ["v4"] }

[dev-dependencies]
proptest = "1.11.0"
rand = "0.10.1"
ureq = { version = "2.10", features = ["json"] }
dotenvy = "0.15.7"
emvault-pkcs11 = { path = "../emvault-pkcs11" }
emvault-dev-signer = { path = "../emvault-dev-signer" }
serial_test = "3.5.0"
