# Pin the toolchain so local dev and CI lint against the identical Rust/clippy
# release (CI's `dtolnay/rust-toolchain@stable` tracks a moving stable, which
# is how a new-in-1.98 clippy lint can slip past an older local check).
# `llvm-tools-preview` is required by the coverage job (`cargo llvm-cov`).
# Bump this deliberately when adopting a newer toolchain.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy", "llvm-tools-preview"]
